<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG → XAML (WPF / Avalonia)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>SVG&nbsp;→&nbsp;XAML</h1>
  <p class="sub">Convert SVG paths &amp; shapes to WPF / Avalonia <code>Geometry</code> and <code>DrawingImage</code>. Runs entirely in your browser.</p>
</header>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>SVG input</h2>
      <div class="actions">
        <label class="btn" for="file">Open file…</label>
        <input id="file" type="file" accept=".svg,image/svg+xml" hidden>
        <button id="sample" class="btn ghost" type="button">Load sample</button>
      </div>
    </div>
    <textarea id="input" spellcheck="false" placeholder="Paste SVG markup here, drop an .svg file, or click Open file…"></textarea>
    <div class="preview">
      <span class="preview-label">Preview</span>
      <div id="preview" class="preview-box"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>XAML output</h2>
      <div class="actions">
        <button id="copy" class="btn" type="button">Copy</button>
        <button id="download" class="btn ghost" type="button">.xaml</button>
      </div>
    </div>

    <div class="options">
      <label>Target
        <select id="target">
          <option value="wpf">WPF</option>
          <option value="avalonia">Avalonia</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="geometry">Geometry (colorless)</option>
          <option value="drawingimage">DrawingImage (colored)</option>
        </select>
      </label>
      <label>x:Key
        <input id="key" type="text" value="Icon" spellcheck="false">
      </label>
      <label class="check"><input id="anchor" type="checkbox" checked> Anchor bounds to viewBox</label>
    </div>

    <div id="status" class="status"></div>
    <textarea id="output" spellcheck="false" readonly placeholder="XAML appears here…"></textarea>
  </section>
</main>

<footer>
  <span id="dropnote">Tip: drag an <code>.svg</code> file anywhere onto the page.</span>
</footer>

<script src="svg2xaml.js"></script>
<script src="app.js"></script>
</body>
</html>
